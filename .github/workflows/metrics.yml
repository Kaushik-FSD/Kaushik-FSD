name: GitHub Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      # 1. Header - profile info only, large display
      - name: Header
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/header.svg
          output_action: store
          base: header, activity, community, repositories
          config_display: large

      # 2. Isometric Calendar only
      - name: Isometric Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/iso_calender.svg
          output_action: store
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # 3. Languages only
      - name: Languages Used
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/langs_used.svg
          output_action: store
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 8

      # 4. Notable contributions only
      - name: Notable Contributions
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/notable_contributions.svg
          output_action: store
          base: ""
          plugin_notable: yes

      # 5. Repositories only
      - name: Repositories
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/repositories.svg
          output_action: store
          base: ""
          plugin_repositories: yes
          plugin_repositories_featured: Kaushik-FSD/InfraCore, Kaushik-FSD/SecureNote