name: GitHub Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Header
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/header.svg
          output_action: store
          config_display: large

      - name: Repositories
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/repositories.svg
          output_action: store
          base: ""
          plugin_repositories: yes

      - name: Activity & Community
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/acti_comm.svg
          output_action: store
          base: ""
          plugin_activity: yes

      - name: Isometric Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/iso_calender.svg
          output_action: store
          base: ""
          plugin_isocalendar: yes

      - name: Languages Used
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/langs_used.svg
          output_action: store
          base: ""
          plugin_languages: yes
          plugin_languages_indepth: yes

      - name: Notable Contributions
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/notable_contributions.svg
          output_action: store
          base: ""
          plugin_notable: yes

      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/achievements.svg
          output_action: store
          base: ""
          plugin_achievements: yes
